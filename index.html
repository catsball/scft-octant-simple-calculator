<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/scft-octant-simple-calculator/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S-CFT 간이 계산기</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('scft-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" crossorigin src="/scft-octant-simple-calculator/assets/index-BocStjs-.js"></script>
    <link rel="stylesheet" crossorigin href="/scft-octant-simple-calculator/assets/index-cm0WiDRu.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
